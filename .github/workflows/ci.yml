name: Verify Action Build

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Action Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Package Action
        run: npm run package
      - name: Verify generated dist is committed
        shell: bash
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::Generated dist/ is out of date."
            echo "Run:"
            echo "  npm ci"
            echo "  npm run build"
            echo "  npm run package"
            echo "then commit the resulting dist/ changes."
            exit 1
          fi
