name: CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Clean generated dist
        run: rm -rf dist/
      - name: Build
        run: npm run build
      - name: Package Action
        run: npm run package
      - name: Verify generated dist is committed
        shell: bash
        run: |
          if ! git diff --quiet --exit-code -- dist/ ||
            [[ -n "$(git ls-files --others --exclude-standard -- dist/)" ]]; then
            git diff --exit-code -- dist/ || true
            git status --short --untracked-files=all -- dist/
            echo "::error::Generated dist/ is out of date."
            echo "Run:"
            echo "  npm ci"
            echo "  rm -rf dist/"
            echo "  npm run build"
            echo "  npm run package"
            echo "  git add --all -- dist/"
            echo "then commit the resulting dist/ changes."
            exit 1
          fi
